<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinição de Senha</title>
    <style>
        body {
            font-family: 'Inter', Arial, sans-serif;
            background: #f5f6fa;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 520px;
            margin: auto;
            background: #fff;
            border-radius: 12px;
            padding: 30px;
            border: 1px solid #e3e7ee;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 22px;
            margin: 10px 0;
        }

        .code-box {
            text-align: center;
            margin: 30px 0;
        }

        .code {
            font-size: 38px;
            font-weight: bold;
            font-family: monospace;
            padding: 12px 20px;
            border-radius: 8px;
            border: 2px dashed #cbd5e1;
            display: inline-block;
            background: #f8fafc;
            letter-spacing: 6px;
        }

        .btn {
            display: block;
            text-align: center;
            background: #4f46e5;
            color: #fff !important;
            padding: 14px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 25px;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 13px;
            color: #6b7280;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div style="font-size: 40px;">🔐</div>
            <h1>Redefinição de Senha</h1>
            <p>Use o código abaixo para continuar</p>
        </div>

        <p>Olá {{user_name}},</p>

        <p>Recebemos sua solicitação de redefinição de senha. Seu código é:</p>

        <div class="code-box">
            <div class="code">{{reset_code}}</div>
            <p style="margin-top: 10px; color: #64748b;">Válido por {{expiration_minutes}} minutos</p>
        </div>

        <a class="btn" href="{{reset_link}}">Redefinir Senha</a>

        <p class="footer">
            © {{current_year}} {{app_name}} — Não responda este e-mail.
        </p>
    </div>
</body>
</html>
