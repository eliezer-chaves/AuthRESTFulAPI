<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Reset</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 480px;
            margin: auto;
            background: #ffffff;
            padding: 24px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }
        .code {
            font-size: 28px;
            font-weight: bold;
            font-family: monospace;
            letter-spacing: 4px;
            background: #f3f4f6;
            padding: 10px 14px;
            border-radius: 6px;
            display: inline-block;
            margin: 12px 0;
        }
        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: #6b7280;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <p>Hello {{user_name}},</p>

        <p>Your password reset code is:</p>

        <p class="code">{{reset_code}}</p>

        <p>This code is valid for {{expiration_minutes}} minute.</p>

        <p>If you did not request a password reset, please ignore this email.</p>

        <p class="footer">
            © {{current_year}} {{app_name}}
        </p>
    </div>
</body>
</html>
